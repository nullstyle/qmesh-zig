name: mesh and messaging composition

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  composition:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, macos-15]
        optimize: [Debug, ReleaseSafe]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7
      - uses: jdx/mise-action@3c2e0cf82a5b2e5249f0d3635a4d83d0ae861518 # v4
      - name: Core, native released pins, and one injected QUIC module
        run: mise exec -- python3 tools/check-composition.py --core --optimize ${{ matrix.optimize }} --jobs 2 --output-dir .zig-cache/ci-evidence
      - uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7
        if: always()
        with:
          name: composition-${{ matrix.os }}-${{ matrix.optimize }}
          include-hidden-files: true
          path: |
            .zig-cache/ci-evidence/*.json
            .zig-cache/ci-evidence/*.log
            .zig-cache/ci-evidence/zig-env.txt
            .zig-cache/ci-evidence/workspace/tests/composition/build.zig.zon
