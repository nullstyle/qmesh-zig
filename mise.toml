[tools]
# mdns-zig 0.1.1 floor (its build.zig.zon minimum_zig_version); quic
# 0.21.1 (the tarball pin in build.zig.zon) builds on it too.
zig = "0.17.0-dev.1786+75044cb04"

[env]
ZIG_GLOBAL_CACHE_DIR = "{{config_root}}/.zig-global-cache"

[tasks.test]
description = "Run the qmesh test suite (unit + sim + quic boundary)"
run = "zig build test"
